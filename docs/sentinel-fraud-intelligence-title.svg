<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
<title id="title">Sentinel Fraud Intelligence | Animated Risk Signal Interface</title>
<desc id="desc">A centered neon Sentinel Fraud Intelligence wordmark surrounded by animated transaction data streams, a radar sweep, network pulses, and risk telemetry motifs.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06131f"/>
    <stop offset=".53" stop-color="#0a1a2a"/>
    <stop offset="1" stop-color="#14172e"/>
  </linearGradient>
  <linearGradient id="type" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c0ffed">
      <animate attributeName="stop-color" values="#c0ffed;#69e6dd;#b9b6ff;#c0ffed" dur="7s" repeatCount="indefinite"/>
    </stop>
    <stop offset=".48" stop-color="#62e2df">
      <animate attributeName="stop-color" values="#62e2df;#b4ffec;#a0a2ff;#62e2df" dur="7s" repeatCount="indefinite"/>
    </stop>
    <stop offset="1" stop-color="#d1c6ff">
      <animate attributeName="stop-color" values="#d1c6ff;#8de7e5;#c5ffe9;#d1c6ff" dur="7s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6ce9dc" stop-opacity="0"/>
    <stop offset=".5" stop-color="#6ce9dc" stop-opacity=".95"/>
    <stop offset="1" stop-color="#a79cff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="coreGlow">
    <stop offset="0" stop-color="#187b7a" stop-opacity=".3"/>
    <stop offset="1" stop-color="#187b7a" stop-opacity="0"/>
  </radialGradient>
  <filter id="softGlow" x="-30%" y="-100%" width="160%" height="300%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" fill="none" stroke="#4b7180" stroke-width=".6" opacity=".24"/>
  </pattern>
</defs>

<!-- Dark observability canvas -->
<rect width="1200" height="260" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="258" rx="23" fill="url(#grid)" opacity=".72"/>
<ellipse cx="600" cy="120" rx="485" ry="160" fill="url(#coreGlow)"/>
<path d="M34 38H1166M34 222H1166" fill="none" stroke="#254552" stroke-width="1"/>
<path d="M34 38H236M964 222H1166" fill="none" stroke="#5fe6db" stroke-width="2" opacity=".8"/>
<circle cx="34" cy="38" r="3" fill="#76f3df"><animate attributeName="opacity" values=".3;1;.3" dur="2.3s" repeatCount="indefinite"/></circle>
<circle cx="1166" cy="222" r="3" fill="#bcb1ff"><animate attributeName="opacity" values="1;.3;1" dur="2.8s" repeatCount="indefinite"/></circle>

<!-- Moving transaction traces -->
<g fill="none" stroke-linecap="round">
  <path d="M58 77H258L278 97H320" stroke="#254f5a" stroke-width="1.5"/>
  <path d="M880 166H922L944 144H1142" stroke="#254f5a" stroke-width="1.5"/>
  <path d="M58 77H258L278 97H320" stroke="url(#trace)" stroke-width="2" stroke-dasharray="68 420">
    <animate attributeName="stroke-dashoffset" values="488;0;-488" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M880 166H922L944 144H1142" stroke="url(#trace)" stroke-width="2" stroke-dasharray="75 420">
    <animate attributeName="stroke-dashoffset" values="495;0;-495" dur="5.8s" repeatCount="indefinite"/>
  </path>
  <path d="M95 193H208M992 73H1105" stroke="#294d5a" stroke-width="1" stroke-dasharray="3 6"/>
</g>
<g fill="#7af0e0">
  <circle cx="258" cy="77" r="3"><animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="944" cy="144" r="3"><animate attributeName="r" values="3;5;3" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="208" cy="193" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="992" cy="73" r="2"><animate attributeName="opacity" values="1;.25;1" dur="3s" repeatCount="indefinite"/></circle>
</g>

<!-- Central signal radar behind the wordmark -->
<g transform="translate(600 119)" fill="none">
  <circle r="102" stroke="#3b7c81" stroke-width="1" stroke-opacity=".12"/>
  <circle r="84" stroke="#55c9c7" stroke-width="1" stroke-opacity=".17" stroke-dasharray="2 9">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="46s" repeatCount="indefinite"/>
  </circle>
  <circle r="62" stroke="#6ce8db" stroke-opacity=".12">
    <animate attributeName="r" values="56;70;56" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".08;.27;.08" dur="4.8s" repeatCount="indefinite"/>
  </circle>
  <path d="M-116 0H116M0 -116V116" stroke="#4c818b" stroke-opacity=".16" stroke-dasharray="2 7"/>
  <path d="M0 0L0 -78A78 78 0 0 1 53 -57Z" fill="#6be2db" fill-opacity=".055" stroke="none">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
  </path>
  <circle r="4" fill="#baffed" stroke="none">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    <circle cx="84" cy="0" r="4" fill="#c7beff" stroke="none"/>
    <circle cx="-84" cy="0" r="3" fill="#6ce8db" stroke="none"/>
  </g>
</g>

<!-- Corner telemetry widgets: risk profile and network graph -->
<g transform="translate(82 104)" stroke="#477e8a" fill="none" stroke-width="1.2" opacity=".85">
  <path d="M0 0L17 -12L32 0L47 -19L64 -8"/>
  <path d="M0 19L19 10L36 21L52 6L66 14" opacity=".65"/>
  <circle cx="0" cy="0" r="3" fill="#72eddd" stroke="none"/>
  <circle cx="17" cy="-12" r="2.5" fill="#72eddd" stroke="none"/>
  <circle cx="32" cy="0" r="3" fill="#c7beff" stroke="none"/>
  <circle cx="47" cy="-19" r="2.5" fill="#72eddd" stroke="none"/>
  <circle cx="64" cy="-8" r="3" fill="#c7beff" stroke="none"/>
  <circle cx="36" cy="21" r="2.5" fill="#72eddd" stroke="none"/>
</g>
<g transform="translate(1050 103)" stroke="#4c8590" fill="none">
  <path d="M0 30V14H12V30M18 30V5H30V30M36 30V-5H48V30M54 30V-17H66V30" stroke-width="5" stroke-opacity=".22"/>
  <path d="M0 30V14H12V30M18 30V5H30V30M36 30V-5H48V30M54 30V-17H66V30" stroke="#67e4dc" stroke-width="1.5" stroke-dasharray="20 60">
    <animate attributeName="stroke-dashoffset" values="80;0;-80" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M-4 -24H74" stroke="#2e5360" stroke-dasharray="2 5"/>
</g>

<!-- Main title: centered and visually dominant -->
<text x="600" y="118" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="900" letter-spacing="2" fill="#60e7dc" opacity=".48" filter="url(#softGlow)">SENTINEL FRAUD INTELLIGENCE</text>
<text x="600" y="118" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="900" letter-spacing="2" fill="url(#type)">SENTINEL FRAUD INTELLIGENCE
  <animate attributeName="opacity" values=".9;1;.9" dur="3.8s" repeatCount="indefinite"/>
</text>

<!-- Risk waveform / scanner underline -->
<path d="M246 151H954" stroke="#315764" stroke-width="1.5" stroke-linecap="round"/>
<path d="M246 151H954" stroke="#6ce8dc" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="100 610" stroke-dashoffset="710">
  <animate attributeName="stroke-dashoffset" values="710;0;-710" dur="5s" repeatCount="indefinite"/>
</path>
<path d="M410 174L430 174L440 165L450 184L462 169L473 174H505M695 174H727L739 165L751 183L764 169L776 174H790" fill="none" stroke="#4fa9b1" stroke-width="1.2" opacity=".42"/>
<g fill="#72e9dd">
  <circle cx="246" cy="151" r="3"><animate attributeName="opacity" values=".3;1;.3" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="954" cy="151" r="3"><animate attributeName="opacity" values="1;.3;1" dur="2.7s" repeatCount="indefinite"/></circle>
</g>

<!-- Status lights around the frame -->
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" letter-spacing="2" fill="#709ba7">
  <text x="56" y="57">SIGNAL MONITOR</text>
  <text x="1144" y="57" text-anchor="end">RISK INTELLIGENCE</text>
  <text x="56" y="211">TX STREAM</text>
  <text x="1144" y="211" text-anchor="end">MODEL ACTIVE</text>
</g>
<circle cx="182" cy="54" r="2.5" fill="#75f0dd"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
<circle cx="1015" cy="54" r="2.5" fill="#c0b7ff"><animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
</svg>
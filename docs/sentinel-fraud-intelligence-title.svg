<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
<title id="title">SENTINEL FRAUD INTELLIGENCE</title>
<desc id="desc">A vivid, centered cyber-intelligence title with a sweeping radar beam, animated data packets, scanning brackets, risk pulses, and a live signal waveform.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030b16"/><stop offset=".5" stop-color="#07182a"/><stop offset="1" stop-color="#10132b"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#d2fff4"><animate attributeName="stop-color" values="#d2fff4;#6fffea;#a8a5ff;#d2fff4" dur="5s" repeatCount="indefinite"/></stop>
    <stop offset=".48" stop-color="#54f5e1"><animate attributeName="stop-color" values="#54f5e1;#b4fff4;#8e9cff;#54f5e1" dur="5s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#c4baff"><animate attributeName="stop-color" values="#c4baff;#80fff0;#e0caff;#c4baff" dur="5s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#39f6de" stop-opacity="0"/>
    <stop offset="1" stop-color="#39f6de" stop-opacity=".26"/>
  </linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#56ffe8" stop-opacity="0"/>
    <stop offset=".5" stop-color="#56ffe8"/>
    <stop offset="1" stop-color="#a7a0ff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="centerGlow">
    <stop offset="0" stop-color="#0a7c82" stop-opacity=".28"/><stop offset="1" stop-color="#0a7c82" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-30%" y="-100%" width="160%" height="300%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="2.5"/>
  </filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#2d6174" stroke-width=".6" opacity=".34"/>
  </pattern>
</defs>

<!-- High contrast command-screen background -->
<rect width="1200" height="280" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="278" rx="23" fill="url(#grid)" opacity=".7"/>
<ellipse cx="600" cy="126" rx="520" ry="190" fill="url(#centerGlow)"/>
<path d="M24 34H1176M24 246H1176" stroke="#254957" stroke-width="1"/>
<path d="M24 34H260M940 246H1176" stroke="#5bffe8" stroke-width="2.5" opacity=".9"/>
<path d="M24 34V66M1176 214V246" stroke="#5bffe8" stroke-width="2.5"/>
<g fill="#65ffeb">
  <circle cx="24" cy="34" r="4"><animate attributeName="r" values="2;4;2" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="1176" cy="246" r="4"><animate attributeName="r" values="4;2;4" dur="1.7s" repeatCount="indefinite"/></circle>
</g>

<!-- Fast-moving data packets along the perimeter -->
<g fill="none" stroke-linecap="round">
  <path d="M54 74H260L280 94H360M840 188H920L942 166H1145" stroke="#24515f" stroke-width="2"/>
  <path d="M54 74H260L280 94H360" stroke="url(#scan)" stroke-width="3" stroke-dasharray="72 390">
    <animate attributeName="stroke-dashoffset" values="462;0;-462" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <path d="M840 188H920L942 166H1145" stroke="url(#scan)" stroke-width="3" stroke-dasharray="80 390">
    <animate attributeName="stroke-dashoffset" values="470;0;-470" dur="3s" repeatCount="indefinite"/>
  </path>
</g>
<g fill="#72ffed" filter="url(#smallGlow)">
  <circle cx="54" cy="74" r="3"><animate attributeName="cx" values="54;360;54" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="1145" cy="166" r="3"><animate attributeName="cx" values="1145;840;1145" dur="3.4s" repeatCount="indefinite"/></circle>
</g>

<!-- Radar sweep, layered behind the title -->
<g transform="translate(600 126)">
  <circle r="116" fill="none" stroke="#3b9ca6" stroke-opacity=".18"/>
  <circle r="91" fill="none" stroke="#44d9d3" stroke-opacity=".22" stroke-dasharray="3 8">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle r="68" fill="none" stroke="#56f8e4" stroke-opacity=".2">
    <animate attributeName="r" values="58;76;58" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".08;.42;.08" dur="3s" repeatCount="indefinite"/>
  </circle>
  <path d="M0 0L0 -108A108 108 0 0 1 76 -76Z" fill="url(#beam)">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.2s" repeatCount="indefinite"/>
  </path>
  <circle r="5" fill="#c9fff4">
    <animate attributeName="r" values="3;7;3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
    <circle cx="91" cy="0" r="4.5" fill="#d0c5ff"/>
    <circle cx="-91" cy="0" r="3.5" fill="#5dffea"/>
  </g>
</g>

<!-- Animated corner data visualizations -->
<g transform="translate(72 118)" fill="none" stroke="#4b9ba5" stroke-width="1.5">
  <path d="M0 0L18 -13L35 3L53 -22L72 -7L88 -18"/>
  <path d="M0 24L19 12L36 26L54 10L73 19L90 4" opacity=".55"/>
  <g fill="#62ffea" stroke="none">
    <circle cx="0" cy="0" r="3"><animate attributeName="r" values="2;4;2" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="35" cy="3" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="72" cy="-7" r="3"><animate attributeName="r" values="2;4;2" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>
</g>
<g transform="translate(1038 108)">
  <g fill="#3f7b8a" opacity=".55">
    <rect x="0" y="27" width="10" height="24" rx="2"/><rect x="16" y="14" width="10" height="37" rx="2"/><rect x="32" y="2" width="10" height="49" rx="2"/><rect x="48" y="19" width="10" height="32" rx="2"/><rect x="64" y="-8" width="10" height="59" rx="2"/>
  </g>
  <g fill="#6affea" filter="url(#smallGlow)">
    <rect x="0" y="27" width="10" height="24" rx="2"><animate attributeName="opacity" values=".25;1;.25" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="16" y="14" width="10" height="37" rx="2"><animate attributeName="opacity" values="1;.25;1" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="32" y="2" width="10" height="49" rx="2"><animate attributeName="opacity" values=".25;1;.25" dur="1.7s" repeatCount="indefinite"/></rect>
    <rect x="48" y="19" width="10" height="32" rx="2"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="64" y="-8" width="10" height="59" rx="2"><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/></rect>
  </g>
</g>

<!-- Scan brackets frame the centered wordmark -->
<g fill="none" stroke="#6affeb" stroke-width="2.5" stroke-linecap="round">
  <path d="M190 91V79H222M978 79H1010V91M190 151V163H222M978 163H1010V151" opacity=".8"/>
  <path d="M205 79H222M978 79H995M205 163H222M978 163H995" stroke-width="1" opacity=".6"/>
</g>
<path d="M228 78H972" stroke="#3b737f" stroke-width="1" stroke-dasharray="2 8" opacity=".8"/>

<!-- Bold central title with a brighter animated glow -->
<text x="600" y="129" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="43" font-weight="900" letter-spacing="1.7" fill="#50ffe7" opacity=".78" filter="url(#glow)">SENTINEL FRAUD INTELLIGENCE</text>
<text x="600" y="129" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="43" font-weight="900" letter-spacing="1.7" fill="url(#neon)">SENTINEL FRAUD INTELLIGENCE
  <animate attributeName="opacity" values=".94;1;.94" dur="2.8s" repeatCount="indefinite"/>
</text>
<path d="M244 174H956" stroke="#285361" stroke-width="2"/>
<path d="M244 174H956" stroke="url(#scan)" stroke-width="4" stroke-linecap="round" stroke-dasharray="150 560" stroke-dashoffset="710">
  <animate attributeName="stroke-dashoffset" values="710;0;-710" dur="3.4s" repeatCount="indefinite"/>
</path>

<!-- Animated risk waveform -->
<path d="M410 196H444L455 185L466 207L478 188L489 196H525M675 196H711L722 185L733 207L745 188L756 196H790" fill="none" stroke="#48c7c8" stroke-width="1.5" opacity=".8"/>
<path d="M410 196H444L455 185L466 207L478 188L489 196H525M675 196H711L722 185L733 207L745 188L756 196H790" fill="none" stroke="#a6a0ff" stroke-width="1.5" stroke-dasharray="20 260" stroke-dashoffset="280">
  <animate attributeName="stroke-dashoffset" values="280;0;-280" dur="2.2s" repeatCount="indefinite"/>
</path>

<!-- Readable system labels and status pulses -->
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="600" letter-spacing="2" fill="#82b5c0">
  <text x="52" y="58">FRAUD SIGNAL / LIVE</text>
  <text x="1148" y="58" text-anchor="end">RISK ENGINE / ACTIVE</text>
  <text x="52" y="230">TX STREAM <tspan fill="#66ffe9">●</tspan></text>
  <text x="1148" y="230" text-anchor="end">MODEL WATCH <tspan fill="#c6baff">●</tspan></text>
</g>
<circle cx="190" cy="54" r="3" fill="#65ffeb"><animate attributeName="opacity" values=".15;1;.15" dur="1.2s" repeatCount="indefinite"/></circle>
<circle cx="1007" cy="54" r="3" fill="#c7baff"><animate attributeName="opacity" values="1;.15;1" dur="1.5s" repeatCount="indefinite"/></circle>
<path d="M360 245H840" stroke="#254653" stroke-width="1"/>
<path d="M360 245H840" stroke="url(#scan)" stroke-width="1.5" stroke-dasharray="60 420" stroke-dashoffset="480">
  <animate attributeName="stroke-dashoffset" values="480;0;-480" dur="4.5s" repeatCount="indefinite"/>
</path>
</svg>
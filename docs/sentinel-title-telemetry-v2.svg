<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
<title id="title">Sentinel Fraud Intelligence | Risk Detection System</title>
<desc id="desc">A high-contrast animated cybersecurity title graphic featuring a transaction pulse stream, fraud risk radar, scanning beam, glowing centered wordmark, and model telemetry.</desc>
<defs>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#040c17"/>
    <stop offset=".5" stop-color="#0a1a2b"/>
    <stop offset="1" stop-color="#15152f"/>
  </linearGradient>
  <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e0fff5">
      <animate attributeName="stop-color" values="#e0fff5;#6cf3e1;#bab5ff;#e0fff5" dur="6s" repeatCount="indefinite"/>
    </stop>
    <stop offset=".54" stop-color="#65f0e4">
      <animate attributeName="stop-color" values="#65f0e4;#ccfff2;#9fa8ff;#65f0e4" dur="6s" repeatCount="indefinite"/>
    </stop>
    <stop offset="1" stop-color="#d6caff">
      <animate attributeName="stop-color" values="#d6caff;#7cf0e3;#ded1ff;#d6caff" dur="6s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5ff7e1" stop-opacity="0"/>
    <stop offset=".5" stop-color="#5ff7e1" stop-opacity="1"/>
    <stop offset="1" stop-color="#b9acff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="riskBars" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#57f2dd"/>
    <stop offset="1" stop-color="#a9a1ff"/>
  </linearGradient>
  <radialGradient id="centerAura">
    <stop offset="0" stop-color="#176e76" stop-opacity=".36"/>
    <stop offset="1" stop-color="#176e76" stop-opacity="0"/>
  </radialGradient>
  <pattern id="microGrid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#4c8290" stroke-width=".7" opacity=".23"/>
    <circle cx="0" cy="0" r="1" fill="#6edfd9" opacity=".24"/>
  </pattern>
  <filter id="glow" x="-30%" y="-120%" width="160%" height="340%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <filter id="smallGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2"/>
  </filter>
</defs>

<!-- High-contrast observability canvas -->
<rect width="1200" height="280" rx="24" fill="url(#canvas)"/>
<rect x="1" y="1" width="1198" height="278" rx="23" fill="url(#microGrid)"/>
<ellipse cx="600" cy="126" rx="440" ry="168" fill="url(#centerAura)"/>
<rect x="18" y="18" width="1164" height="244" rx="18" fill="none" stroke="#2c5968" stroke-width="1.2"/>
<path d="M34 48H206M994 48H1166M34 232H210M990 232H1166" stroke="#57eadb" stroke-width="2" opacity=".85"/>
<path d="M34 48l10 -10h34M1166 48l-10 -10h-34M34 232l10 10h34M1166 232l-10 10h-34" fill="none" stroke="#9b91ff" stroke-width="1.4"/>

<!-- Left: incoming transaction stream -->
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
  <text x="50" y="70" font-size="10" font-weight="700" letter-spacing="2" fill="#8deee2">TX STREAM</text>
  <text x="50" y="86" font-size="8" letter-spacing="1.5" fill="#678e9c">INBOUND SIGNALS</text>
  <path d="M50 104H226M50 144H226M50 184H226" stroke="#274a59" stroke-width="1"/>
  <g fill="#6ef2de">
    <circle cx="55" cy="119" r="2.5"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="55" cy="159" r="2.5"><animate attributeName="opacity" values="1;.25;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="55" cy="199" r="2.5"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" repeatCount="indefinite"/></circle>
  </g>
  <text x="65" y="122" font-size="9" fill="#8aaebb">PAYMENT EVENT</text>
  <text x="65" y="162" font-size="9" fill="#8aaebb">FEATURE VECTOR</text>
  <text x="65" y="202" font-size="9" fill="#8aaebb">MODEL INPUT</text>
  <rect x="65" y="128" width="132" height="3" rx="1.5" fill="#244653"/>
  <rect x="65" y="128" width="98" height="3" rx="1.5" fill="url(#riskBars)">
    <animate attributeName="width" values="48;132;76;110;48" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="65" y="168" width="132" height="3" rx="1.5" fill="#244653"/>
  <rect x="65" y="168" width="70" height="3" rx="1.5" fill="url(#riskBars)">
    <animate attributeName="width" values="94;52;120;70;94" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="65" y="208" width="132" height="3" rx="1.5" fill="#244653"/>
  <rect x="65" y="208" width="116" height="3" rx="1.5" fill="url(#riskBars)">
    <animate attributeName="width" values="72;122;85;116;72" dur="3.3s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- Right: prominent fraud risk radar -->
<g transform="translate(1065 140)">
  <circle r="77" fill="#071622" fill-opacity=".46" stroke="#2d6571" stroke-width="1.2"/>
  <circle r="58" fill="none" stroke="#2d6571" stroke-width="1"/>
  <circle r="38" fill="none" stroke="#2d6571" stroke-width="1"/>
  <circle r="18" fill="none" stroke="#5cebdc" stroke-opacity=".7" stroke-width="1.4"/>
  <path d="M-77 0H77M0 -77V77M-54 -54L54 54M-54 54L54 -54" stroke="#2d6571" stroke-width=".8" opacity=".7"/>
  <path d="M0 0L0 -74A74 74 0 0 1 67 -31Z" fill="#53e8d8" fill-opacity=".22">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5.5s" repeatCount="indefinite"/>
  </path>
  <circle r="4" fill="#c8fff1" filter="url(#smallGlow)"/>
  <circle r="4" fill="#c8fff1">
    <animate attributeName="r" values="3;6;3" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="-28" r="5" fill="#ff7bba">
    <animate attributeName="opacity" values=".25;1;.25" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;6;3" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="-46" cy="19" r="3.5" fill="#7cf6e4">
    <animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="45" cy="40" r="2.5" fill="#b9acff"/>
</g>
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" text-anchor="end">
  <text x="1150" y="62" font-size="10" font-weight="700" letter-spacing="2" fill="#c5b8ff">RISK RADAR</text>
  <text x="1150" y="78" font-size="8" letter-spacing="1.1" fill="#678e9c">ANOMALY SCAN</text>
  <rect x="1011" y="232" width="140" height="5" rx="2.5" fill="#233f50"/>
  <rect x="1011" y="232" width="96" height="5" rx="2.5" fill="url(#riskBars)">
    <animate attributeName="width" values="72;122;96;110;72" dur="3.8s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- Center title field, deliberately clear and dominant -->
<path d="M252 74H948M252 190H948" stroke="#2d5967" stroke-width="1"/>
<path d="M252 74H440M760 190H948" stroke="#65f1df" stroke-width="2.3"/>
<text x="600" y="126" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="900" letter-spacing="1.4" fill="#61f1e2" opacity=".6" filter="url(#glow)">SENTINEL FRAUD INTELLIGENCE</text>
<text x="600" y="126" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="900" letter-spacing="1.4" fill="url(#wordmark)">SENTINEL FRAUD INTELLIGENCE
  <animate attributeName="opacity" values=".93;1;.93" dur="3s" repeatCount="indefinite"/>
</text>
<text x="600" y="151" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="4.5" fill="#9abac7">DETECT  /  SCORE  /  REVIEW  /  MONITOR</text>

<!-- Animated scanner sweeps across the title area -->
<rect x="260" y="162" width="680" height="2" rx="1" fill="#203e4e"/>
<rect x="260" y="162" width="680" height="2" rx="1" fill="url(#beam)" stroke="none">
  <animate attributeName="x" values="260;940;260" dur="4.2s" repeatCount="indefinite"/>
</rect>
<path d="M300 177H900" stroke="#203c4d" stroke-width="1"/>
<path d="M300 177H900" stroke="url(#beam)" stroke-width="1.5" stroke-dasharray="90 510" stroke-dashoffset="600">
  <animate attributeName="stroke-dashoffset" values="600;0;-600" dur="5s" repeatCount="indefinite"/>
</path>

<!-- Fast network packets travelling toward the radar -->
<g fill="#7af4e3">
  <circle cx="234" cy="100" r="2.5"><animate attributeName="cx" values="234;268;234" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".25;1;.25" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="965" cy="202" r="2.5"><animate attributeName="cx" values="965;935;965" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="278" cy="210" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="922" cy="89" r="2"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
</g>

<!-- Footer instrumentation and frame anchors -->
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="8.5" letter-spacing="1.5" fill="#7296a5">
  <text x="50" y="249">STREAM :: ACTIVE</text>
  <text x="600" y="249" text-anchor="middle">ML.NET  /  RISK SCORING ENGINE</text>
  <text x="1150" y="249" text-anchor="end">MODEL :: WATCHING</text>
</g>
<circle cx="178" cy="246" r="2.5" fill="#63f2df"><animate attributeName="opacity" values=".25;1;.25" dur="1.4s" repeatCount="indefinite"/></circle>
<circle cx="1034" cy="246" r="2.5" fill="#ff7bba"><animate attributeName="opacity" values="1;.25;1" dur="1.7s" repeatCount="indefinite"/></circle>
</svg>
</g>
<g id="slide5" opacity="0">
 <rect x="38" y="34" width="1124" height="652" rx="18" fill="#0b1725" stroke="#355065"/><text x="70" y="82" class="label">05 / EVALUATION LAB</text><text x="70" y="123" class="heading">Measure the model beyond accuracy</text>
 <g><rect x="70" y="155" width="235" height="110" rx="10" class="panel"/><text x="95" y="188" class="tiny">PR-AUC</text><text x="95" y="230" class="metric">0.84</text><rect x="325" y="155" width="235" height="110" rx="10" class="panel"/><text x="350" y="188" class="tiny">PRECISION</text><text x="350" y="230" class="metric">0.79</text><rect x="580" y="155" width="235" height="110" rx="10" class="panel"/><text x="605" y="188" class="tiny">RECALL</text><text x="605" y="230" class="metric">0.72</text><rect x="835" y="155" width="295" height="110" rx="10" class="panel"/><text x="860" y="188" class="tiny">F1 SCORE</text><text x="860" y="230" class="metric">0.75</text></g>

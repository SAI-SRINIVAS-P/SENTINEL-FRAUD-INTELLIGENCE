<g id="slide6" opacity="0">
 <rect x="38" y="34" width="1124" height="652" rx="18" fill="#0b1725" stroke="#355065"/><text x="70" y="82" class="label">06 / MODEL HEALTH</text><text x="70" y="123" class="heading">Watch behavior after deployment</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">SENTINEL animated risk observatory title</title>
<desc id="desc">Custom animated Sentinel title with scanning signal, moving nodes, and pulsing risk rings.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06121f"/><stop offset=".55" stop-color="#102b42"/><stop offset="1" stop-color="#17113b"/></linearGradient>
  <linearGradient id="glow"><stop stop-color="#4df4d4"/><stop offset=".52" stop-color="#42a5ff"/><stop offset="1" stop-color="#a879ff"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
  <clipPath id="clip"><rect width="1200" height="300" rx="24"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1200" height="300" fill="url(#bg)"/>
<g fill="none" stroke="#4de8dc" opacity=".16">
 <circle cx="1010" cy="140" r="62"><animate attributeName="r" values="52;80;52" dur="5s" repeatCount="indefinite"/></circle>
 <circle cx="1010" cy="140" r="104"><animate attributeName="r" values="92;125;92" dur="6s" repeatCount="indefinite"/></circle>
 <circle cx="1010" cy="140" r="150"><animate attributeName="r" values="138;166;138" dur="7s" repeatCount="indefinite"/></circle>
</g>
<g stroke="url(#glow)" stroke-width="1.5" opacity=".45">
 <path d="M760 45L850 95 935 58 1010 140 1120 88 1180 160"/>
 <path d="M780 225L875 178 945 228 1010 140 1100 220 1170 200"/>
</g>
<g fill="#5fffe4">
 <circle cx="850" cy="95" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/></circle>
 <circle cx="935" cy="58" r="3"><animate attributeName="opacity" values="1;.25;1" dur="2.2s" repeatCount="indefinite"/></circle>
 <circle cx="1120" cy="88" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="2.6s" repeatCount="indefinite"/></circle>
 <circle cx="945" cy="228" r="3"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
</g>
<rect x="54" y="48" width="8" height="194" rx="4" fill="url(#glow)"/>
<text x="88" y="105" fill="#9bb6ca" font-family="Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="6">TRANSACTION RISK OBSERVATORY</text>
<text x="82" y="178" fill="#f0f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="2">SENTINEL</text>
<text x="87" y="215" fill="#77f3e2" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" letter-spacing="5">FRAUD INTELLIGENCE</text>
<rect x="84" y="236" width="410" height="2" rx="1" fill="#263f56"/>
<rect x="84" y="236" width="120" height="2" rx="1" fill="url(#glow)"><animate attributeName="x" values="84;370;84" dur="4s" repeatCount="indefinite"/></rect>
<text x="790" y="270" fill="#a4bfd2" font-family="Consolas,monospace" font-size="12" letter-spacing="2">SIGNAL / REVIEW / LEARN</text>
<rect x="1" y="1" width="1198" height="298" rx="24" fill="none" stroke="#4a7996" stroke-opacity=".7"/>
</g></svg>
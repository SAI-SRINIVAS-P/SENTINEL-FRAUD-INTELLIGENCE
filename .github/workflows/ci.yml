name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/Fraud.Api.Tests/Fraud.Api.Tests.csproj
      - name: Test
        run: dotnet test tests/Fraud.Api.Tests/Fraud.Api.Tests.csproj --configuration Release --no-restore

  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: web
        run: npm run build
